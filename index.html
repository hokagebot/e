<script>
const slips=[{"title": "SLIP No. 1", "text": "##############################################################################\nSLIP No. 1\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 10 d.f. Find the 60th percentile, present it on a graph, and write the function used.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type:  Percentile  (just a label).\nSTEP 2: Click cell B1 and type:  =T.INV(0.6,10)   then press ENTER.\nSTEP 3:    -> B1 shows 0.2602.  This is the 60th percentile (P(X <= x) = 0.6).\nSTEP 4: GRAPH DATA - click cell D1 and type:  x   ;  click E1 and type:  f(x)\nSTEP 5: Click D2 and type -4 ; click D3 and type -3.5.\nSTEP 6: Select D2:D3, then drag the small square at the bottom-right corner of the selection downward until the last value is 4 (cell D18).\nSTEP 7: Click E2 and type:  =T.DIST(D2,10,FALSE)  and press ENTER. (FALSE gives the curve height.)\nSTEP 8: Click E2 again, then drag the small square at its bottom-right corner down to E18 so all rows are filled.\nSTEP 9: Mark the percentile point: click G1 and type =B1 ; click H1 and type =T.DIST(G1,10,FALSE) (height of curve at the percentile).\nSTEP 10: Select D1:E18 > Insert > Charts > Scatter > 'Scatter with Smooth Lines'.\nSTEP 11: Right-click the chart > Select Data > Add > Series name: Percentile ; X values: G1 ; Y values: H1 > OK. Change this new series to markers only (Format Data Series > Marker).\nSTEP 12: Click the chart title and type:  t-distribution (df = 10) with 60th percentile.  Add axis titles x and f(x).\nWRITE IN EXAM:\n   Function used : =T.INV(0.6,10)\n   60th percentile = 0.2602\n   Graph: bell-shaped curve with the point x = 0.2602 marked on it (attach the chart).\n\nQ1(b) [3 marks]  X ~ N(12,16). Find (i) P(0<=X<=12) (ii) P(X>=20) (iii) P(X<=12).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 12 ; variance = 16 so SD = square root of variance.\nSTEP 2: Click cell A1 type 'Mean'; click B1 and type  =12  ENTER.\nSTEP 3: Click A2 type 'Variance'; click B2 and type  =16  ENTER.\nSTEP 4: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 4.0000\nSTEP 5: For P(0<=X<=12):  click an empty cell (say D1) and type  =NORM.DIST(12,B1,B3,TRUE)-NORM.DIST(0,B1,B3,TRUE)  ENTER.   -> D1 = 0.4987\nSTEP 6: For P(X>=20):  click an empty cell (say D2) and type  =1-NORM.DIST(20,B1,B3,TRUE)  ENTER.   -> D2 = 0.0228\nSTEP 7: For P(X<=12):  click an empty cell (say D3) and type  =NORM.DIST(12,B1,B3,TRUE)  ENTER.   -> D3 = 0.5000\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(0<=X<=12)         =NORM.DIST(12,12,4,TRUE)-NORM.DIST(0,12,4,TRUE)         0.4987\n   P(X>=20)            =1-NORM.DIST(20,12,4,TRUE)                              0.0228\n   P(X<=12)            =NORM.DIST(12,12,4,TRUE)                                0.5000"}, {"title": "SLIP No. 2", "text": "##############################################################################\nSLIP No. 2\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 10 and n2 = 9 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=5.26):  click cell B1 and type:  =F.DIST.RT(5.26,10,9)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0100.\nSTEP 4: For part (ii)  P(X<=1.90):  click cell B2 and type:  =F.DIST(1.9,10,9,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.8258.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=5.26)             =F.DIST.RT(5.26,10,9)              0.0100\n   P(X<=1.90)             =F.DIST(1.9,10,9,TRUE)             0.8258\n\nQ1(b) [3 marks]  X ~ N(0,1). Find (i) P(-1<=Z<=0) (ii) P(Z<=-1) (iii) P(X>=-2).\n------------------------------------------------------------------------------\nSTEP 1: This is the STANDARD normal N(0,1), so use NORM.S.DIST(z,TRUE). No mean/sd needed.\nSTEP 2: For P(-1<=Z<=0):  click an empty cell (say D1) and type  =NORM.S.DIST(0,TRUE)-NORM.S.DIST(-1,TRUE)  ENTER.   -> D1 = 0.3413\nSTEP 3: For P(Z<=-1):  click an empty cell (say D2) and type  =NORM.S.DIST(-1,TRUE)  ENTER.   -> D2 = 0.1587\nSTEP 4: For P(X>=-2):  click an empty cell (say D3) and type  =1-NORM.S.DIST(-2,TRUE)  ENTER.   -> D3 = 0.9772\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(-1<=Z<=0)         =NORM.S.DIST(0,TRUE)-NORM.S.DIST(-1,TRUE)               0.3413\n   P(Z<=-1)            =NORM.S.DIST(-1,TRUE)                                   0.1587\n   P(X>=-2)            =1-NORM.S.DIST(-2,TRUE)                                 0.9772"}, {"title": "SLIP No. 3", "text": "##############################################################################\nSLIP No. 3\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 10 and n2 = 6 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=5.77):  click cell B1 and type:  =F.DIST.RT(5.77,10,6)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0219.\nSTEP 4: For part (ii)  P(X<=2.56):  click cell B2 and type:  =F.DIST(2.56,10,6,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.8689.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=5.77)             =F.DIST.RT(5.77,10,6)              0.0219\n   P(X<=2.56)             =F.DIST(2.56,10,6,TRUE)            0.8689\n\nQ1(b) [3 marks]  X~N(1,1) indep. Y~N(2,4); Z=2X+Y. Find distribution; (i) P(2X+Y>3) (ii) P(2X+Y<3).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): Mean = 2(1)+1(2) = 4 ; Variance = 2^2(1)+1^2(4) = 4+4 = 8 ; SD = sqrt(8) = 2.8284\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =2*1+1*2  ENTER.  -> B1 = 4\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =4*1+1*4  ENTER.  -> B2 = 8\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 2.8284\n   So the distribution is  Z ~ N(mu = 4, sigma^2 = 8).\nSTEP 4: For P(2X+Y>3):  click an empty cell (say D1) and type  =1-NORM.DIST(3,B1,B3,TRUE)  ENTER.   -> D1 = 0.6382\nSTEP 5: For P(2X+Y<3):  click an empty cell (say D2) and type  =NORM.DIST(3,B1,B3,TRUE)  ENTER.   -> D2 = 0.3618\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 4, sigma^2 = 8)\n   Example             Function used                                           Probability\n   P(2X+Y>3)           =1-NORM.DIST(3,4,SQRT(8),TRUE)                          0.6382\n   P(2X+Y<3)           =NORM.DIST(3,4,SQRT(8),TRUE)                            0.3618"}, {"title": "SLIP No. 4", "text": "##############################################################################\nSLIP No. 4\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 10 and n2 = 18 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=3.12):  click cell B1 and type:  =F.DIST.RT(3.12,10,18)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0173.\nSTEP 4: For part (ii)  P(X<=1.58):  click cell B2 and type:  =F.DIST(1.58,10,18,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.8087.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=3.12)             =F.DIST.RT(3.12,10,18)             0.0173\n   P(X<=1.58)             =F.DIST(1.58,10,18,TRUE)           0.8087\n\nQ1(b) [3 marks]  Mean yield 662 kg, SD 32 kg, normal. Of 1000 plots how many would have yield (i) greater than 700 (ii) less than 650?\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 662 ; variance = 1024 so SD = 32.\nSTEP 2: Click B1 and type  =662  (mean) ; click B3 and type  =32  (SD).\nSTEP 3: For P(X>700):  click an empty cell (say D1) and type  =1-NORM.DIST(700,B1,B3,TRUE)  ENTER.   -> D1 = 0.1175\nSTEP 4: For P(X<=650):  click an empty cell (say D2) and type  =NORM.DIST(650,B1,B3,TRUE)  ENTER.   -> D2 = 0.3538\nSTEP 5: Number of plots/students for P(X>700): click F1 and type  =1000*D1  ENTER.  -> 1000 x 0.1175 = 117.52  (round to 118).\nSTEP 6: Number of plots/students for P(X<=650): click F2 and type  =1000*D2  ENTER.  -> 1000 x 0.3538 = 353.83  (round to 354).\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                 Probability No. of\n   P(X>700)            =1-NORM.DIST(700,662,32,TRUE)                 0.1175      118\n   P(X<=650)           =NORM.DIST(650,662,32,TRUE)                   0.3538      354"}, {"title": "SLIP No. 5", "text": "##############################################################################\nSLIP No. 5\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 18 and n2 = 6 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.01:  click cell B1 and type:  =F.INV.RT(0.01,18,6)   then press ENTER.\nSTEP 3:    -> B1 shows 7.4507.\nSTEP 4: For part (ii)  P(X<=x)=0.5:  click cell B2 and type:  =F.INV(0.5,18,6)   then press ENTER.\nSTEP 5:    -> B2 shows 1.0804.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.01           =F.INV.RT(0.01,18,6)               7.4507\n   P(X<=x)=0.5            =F.INV(0.5,18,6)                   1.0804\n\nQ1(b) [3 marks]  X ~ N(0,1). Find (i) P(-1<=Z<=3) (ii) P(Z<=-1) (iii) P(Z<=1).\n------------------------------------------------------------------------------\nSTEP 1: This is the STANDARD normal N(0,1), so use NORM.S.DIST(z,TRUE). No mean/sd needed.\nSTEP 2: For P(-1<=Z<=3):  click an empty cell (say D1) and type  =NORM.S.DIST(3,TRUE)-NORM.S.DIST(-1,TRUE)  ENTER.   -> D1 = 0.8400\nSTEP 3: For P(Z<=-1):  click an empty cell (say D2) and type  =NORM.S.DIST(-1,TRUE)  ENTER.   -> D2 = 0.1587\nSTEP 4: For P(Z<=1):  click an empty cell (say D3) and type  =NORM.S.DIST(1,TRUE)  ENTER.   -> D3 = 0.8413\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(-1<=Z<=3)         =NORM.S.DIST(3,TRUE)-NORM.S.DIST(-1,TRUE)               0.8400\n   P(Z<=-1)            =NORM.S.DIST(-1,TRUE)                                   0.1587\n   P(Z<=1)             =NORM.S.DIST(1,TRUE)                                    0.8413"}, {"title": "SLIP No. 6", "text": "##############################################################################\nSLIP No. 6\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 10 and n2 = 8 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.05:  click cell B1 and type:  =F.INV.RT(0.05,10,8)   then press ENTER.\nSTEP 3:    -> B1 shows 3.3472.\nSTEP 4: For part (ii)  P(X<=x)=0.01:  click cell B2 and type:  =F.INV(0.01,10,8)   then press ENTER.\nSTEP 5:    -> B2 shows 0.1978.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.05           =F.INV.RT(0.05,10,8)               3.3472\n   P(X<=x)=0.01           =F.INV(0.01,10,8)                  0.1978\n\nQ1(b) [3 marks]  X ~ B(n=720, p=0.5): normal approximation, then (i) P(X>345) (ii) P(X<=350).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = np = 720 x 0.5 = 360 ; sigma^2 = npq = 720 x 0.5 x 0.5 = 180 ; SD = sqrt(180) = 13.4164\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =720*0.5  ENTER.  -> B1 = 360\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =720*0.5*0.5  ENTER.  -> B2 = 180\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 13.4164\n   So the distribution is  X -> N(mu = 360, sigma^2 = 180).\nSTEP 4: For P(X>345):  click an empty cell (say D1) and type  =1-NORM.DIST(345,B1,B3,TRUE)  ENTER.   -> D1 = 0.8682\nSTEP 5: For P(X<=350):  click an empty cell (say D2) and type  =NORM.DIST(350,B1,B3,TRUE)  ENTER.   -> D2 = 0.2280\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 360, sigma^2 = 180)\n   Example             Function used                                           Probability\n   P(X>345)            =1-NORM.DIST(345,360,SQRT(180),TRUE)                    0.8682\n   P(X<=350)           =NORM.DIST(350,360,SQRT(180),TRUE)                      0.2280"}, {"title": "SLIP No. 7", "text": "##############################################################################\nSLIP No. 7\n##############################################################################\nQ1(a) [2 marks]  X ~ F-distribution with n1 = 20 and n2 = 12 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.95:  click cell B1 and type:  =F.INV.RT(0.95,20,12)   then press ENTER.\nSTEP 3:    -> B1 shows 0.4391.\nSTEP 4: For part (ii)  P(X>=x)=0.1:  click cell B2 and type:  =F.INV.RT(0.1,20,12)   then press ENTER.\nSTEP 5:    -> B2 shows 2.0597.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.95           =F.INV.RT(0.95,20,12)              0.4391\n   P(X>=x)=0.1            =F.INV.RT(0.1,20,12)               2.0597\n\nQ1(b) [3 marks]  X ~ P(lambda=15): normal approximation, then (i) P(X<=18) (ii) P(18<X<=20).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = lambda = 15 ; sigma^2 = lambda = 15 ; SD = sqrt(15) = 3.8730\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =15  ENTER.  -> B1 = 15\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =15  ENTER.  -> B2 = 15\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 3.8730\n   So the distribution is  X -> N(mu = 15, sigma^2 = 15).\nSTEP 4: For P(X<=18):  click an empty cell (say D1) and type  =NORM.DIST(18,B1,B3,TRUE)  ENTER.   -> D1 = 0.7807\nSTEP 5: For P(18<X<=20):  click an empty cell (say D2) and type  =NORM.DIST(20,B1,B3,TRUE)-NORM.DIST(18,B1,B3,TRUE)  ENTER.   -> D2 = 0.1209\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 15, sigma^2 = 15)\n   Example             Function used                                           Probability\n   P(X<=18)            =NORM.DIST(18,15,SQRT(15),TRUE)                         0.7807\n   P(18<X<=20)         =NORM.DIST(20,15,SQRT(15),TRUE)-NORM.DIST(18,15,SQRT(15),TRUE)0.1209"}, {"title": "SLIP No. 8", "text": "##############################################################################\nSLIP No. 8\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 10 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.2:  click cell B1 and type:  =CHISQ.INV.RT(0.2,10)   then press ENTER.\nSTEP 3:    -> B1 shows 13.4420.\nSTEP 4: For part (ii)  P(X<=x)=0.75:  click cell B2 and type:  =CHISQ.INV(0.75,10)   then press ENTER.\nSTEP 5:    -> B2 shows 12.5489.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.2            =CHISQ.INV.RT(0.2,10)              13.4420\n   P(X<=x)=0.75           =CHISQ.INV(0.75,10)                12.5489\n\nQ1(b) [3 marks]  X ~ N(5,25). Find (i) P(-15<=X<=15) (ii) P(X<=-15) (iii) P(X<=15).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 5 ; variance = 25 so SD = square root of variance.\nSTEP 2: Click cell A1 type 'Mean'; click B1 and type  =5  ENTER.\nSTEP 3: Click A2 type 'Variance'; click B2 and type  =25  ENTER.\nSTEP 4: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 5.0000\nSTEP 5: For P(-15<=X<=15):  click an empty cell (say D1) and type  =NORM.DIST(15,B1,B3,TRUE)-NORM.DIST(-15,B1,B3,TRUE)  ENTER.   -> D1 = 0.9772\nSTEP 6: For P(X<=-15):  click an empty cell (say D2) and type  =NORM.DIST(-15,B1,B3,TRUE)  ENTER.   -> D2 = 0.0000\nSTEP 7: For P(X<=15):  click an empty cell (say D3) and type  =NORM.DIST(15,B1,B3,TRUE)  ENTER.   -> D3 = 0.9772\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(-15<=X<=15)       =NORM.DIST(15,5,5,TRUE)-NORM.DIST(-15,5,5,TRUE)         0.9772\n   P(X<=-15)           =NORM.DIST(-15,5,5,TRUE)                                0.0000\n   P(X<=15)            =NORM.DIST(15,5,5,TRUE)                                 0.9772"}, {"title": "SLIP No. 9", "text": "##############################################################################\nSLIP No. 9\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 12 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.05:  click cell B1 and type:  =CHISQ.INV.RT(0.05,12)   then press ENTER.\nSTEP 3:    -> B1 shows 21.0261.\nSTEP 4: For part (ii)  P(X<=x)=0.01:  click cell B2 and type:  =CHISQ.INV(0.01,12)   then press ENTER.\nSTEP 5:    -> B2 shows 3.5706.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.05           =CHISQ.INV.RT(0.05,12)             21.0261\n   P(X<=x)=0.01           =CHISQ.INV(0.01,12)                3.5706\n\nQ1(b) [3 marks]  X ~ N(3,4). Find (i) P(X>5) (ii) P(X<=1) (iii) P(X>0).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 3 ; variance = 4 so SD = square root of variance.\nSTEP 2: Click cell A1 type 'Mean'; click B1 and type  =3  ENTER.\nSTEP 3: Click A2 type 'Variance'; click B2 and type  =4  ENTER.\nSTEP 4: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 2.0000\nSTEP 5: For P(X>5):  click an empty cell (say D1) and type  =1-NORM.DIST(5,B1,B3,TRUE)  ENTER.   -> D1 = 0.1587\nSTEP 6: For P(X<=1):  click an empty cell (say D2) and type  =NORM.DIST(1,B1,B3,TRUE)  ENTER.   -> D2 = 0.1587\nSTEP 7: For P(X>0):  click an empty cell (say D3) and type  =1-NORM.DIST(0,B1,B3,TRUE)  ENTER.   -> D3 = 0.9332\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(X>5)              =1-NORM.DIST(5,3,2,TRUE)                                0.1587\n   P(X<=1)             =NORM.DIST(1,3,2,TRUE)                                  0.1587\n   P(X>0)              =1-NORM.DIST(0,3,2,TRUE)                                0.9332"}, {"title": "SLIP No. 10", "text": "##############################################################################\nSLIP No. 10\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 14 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.95:  click cell B1 and type:  =CHISQ.INV.RT(0.95,14)   then press ENTER.\nSTEP 3:    -> B1 shows 6.5706.\nSTEP 4: For part (ii)  P(X<=x)=0.1:  click cell B2 and type:  =CHISQ.INV(0.1,14)   then press ENTER.\nSTEP 5:    -> B2 shows 7.7895.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.95           =CHISQ.INV.RT(0.95,14)             6.5706\n   P(X<=x)=0.1            =CHISQ.INV(0.1,14)                 7.7895\n\nQ1(b) [3 marks]  X ~ N(5,4); Z = 2X+3. Find distribution; (i) P(2X+3<17) (ii) P(2X+3>14).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): Mean = 2(5)+3 = 13 ; Variance = 2^2(4) = 16 (adding 3 does not change variance) ; SD = 4\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =2*5+3  ENTER.  -> B1 = 13\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =4*4  ENTER.  -> B2 = 16\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 4.0000\n   So the distribution is  Z ~ N(mu = 13, sigma^2 = 16).\nSTEP 4: For P(2X+3<17):  click an empty cell (say D1) and type  =NORM.DIST(17,B1,B3,TRUE)  ENTER.   -> D1 = 0.8413\nSTEP 5: For P(2X+3>14):  click an empty cell (say D2) and type  =1-NORM.DIST(14,B1,B3,TRUE)  ENTER.   -> D2 = 0.4013\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 13, sigma^2 = 16)\n   Example             Function used                                           Probability\n   P(2X+3<17)          =NORM.DIST(17,13,4,TRUE)                                0.8413\n   P(2X+3>14)          =1-NORM.DIST(14,13,4,TRUE)                              0.4013"}, {"title": "SLIP No. 11", "text": "##############################################################################\nSLIP No. 11\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 12 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=9.232):  click cell B1 and type:  =CHISQ.DIST.RT(9.232,12)   then press ENTER.\nSTEP 3:    -> B1 shows 0.6830.\nSTEP 4: For part (ii)  P(X<=9.650):  click cell B2 and type:  =CHISQ.DIST(9.65,12,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.3534.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=9.232)            =CHISQ.DIST.RT(9.232,12)           0.6830\n   P(X<=9.650)            =CHISQ.DIST(9.65,12,TRUE)          0.3534\n\nQ1(b) [3 marks]  X~N(15,4) indep. Y~N(5,9); Z=X+2Y. Find distribution; (i) P(X+2Y<=30) (ii) P(X+2Y>20).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): Mean = 15+2(5) = 25 ; Variance = 1^2(4)+2^2(9) = 4+36 = 40 ; SD = sqrt(40) = 6.3246\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =15+2*5  ENTER.  -> B1 = 25\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =1*4+4*9  ENTER.  -> B2 = 40\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 6.3246\n   So the distribution is  Z ~ N(mu = 25, sigma^2 = 40).\nSTEP 4: For P(X+2Y<=30):  click an empty cell (say D1) and type  =NORM.DIST(30,B1,B3,TRUE)  ENTER.   -> D1 = 0.7854\nSTEP 5: For P(X+2Y>20):  click an empty cell (say D2) and type  =1-NORM.DIST(20,B1,B3,TRUE)  ENTER.   -> D2 = 0.7854\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 25, sigma^2 = 40)\n   Example             Function used                                           Probability\n   P(X+2Y<=30)         =NORM.DIST(30,25,SQRT(40),TRUE)                         0.7854\n   P(X+2Y>20)          =1-NORM.DIST(20,25,SQRT(40),TRUE)                       0.7854"}, {"title": "SLIP No. 12", "text": "##############################################################################\nSLIP No. 12\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 20 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=23.526):  click cell B1 and type:  =CHISQ.DIST.RT(23.526,20)   then press ENTER.\nSTEP 3:    -> B1 shows 0.2637.\nSTEP 4: For part (ii)  P(X<=18.455):  click cell B2 and type:  =CHISQ.DIST(18.455,20,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.4425.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=23.526)           =CHISQ.DIST.RT(23.526,20)          0.2637\n   P(X<=18.455)           =CHISQ.DIST(18.455,20,TRUE)        0.4425\n\nQ1(b) [3 marks]  X ~ B(n=500, p=0.3): normal approximation, then (i) P(X>165) (ii) P(X<=145).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = np = 500 x 0.3 = 150 ; sigma^2 = npq = 500 x 0.3 x 0.7 = 105 ; SD = sqrt(105) = 10.2470\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =500*0.3  ENTER.  -> B1 = 150\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =500*0.3*0.7  ENTER.  -> B2 = 105\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 10.2470\n   So the distribution is  X -> N(mu = 150, sigma^2 = 105).\nSTEP 4: For P(X>165):  click an empty cell (say D1) and type  =1-NORM.DIST(165,B1,B3,TRUE)  ENTER.   -> D1 = 0.0716\nSTEP 5: For P(X<=145):  click an empty cell (say D2) and type  =NORM.DIST(145,B1,B3,TRUE)  ENTER.   -> D2 = 0.3128\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 150, sigma^2 = 105)\n   Example             Function used                                           Probability\n   P(X>165)            =1-NORM.DIST(165,150,SQRT(105),TRUE)                    0.0716\n   P(X<=145)           =NORM.DIST(145,150,SQRT(105),TRUE)                      0.3128"}, {"title": "SLIP No. 13", "text": "##############################################################################\nSLIP No. 13\n##############################################################################\nQ1(a) [2 marks]  X ~ Chi-square with 10 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=14.256):  click cell B1 and type:  =CHISQ.DIST.RT(14.256,10)   then press ENTER.\nSTEP 3:    -> B1 shows 0.1616.\nSTEP 4: For part (ii)  P(X<=8.2449):  click cell B2 and type:  =CHISQ.DIST(8.2449,10,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.3951.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=14.256)           =CHISQ.DIST.RT(14.256,10)          0.1616\n   P(X<=8.2449)           =CHISQ.DIST(8.2449,10,TRUE)        0.3951\n\nQ1(b) [3 marks]  X ~ P(lambda=16): normal approximation, then (i) P(X<=8) (ii) P(4<X<=8).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = lambda = 16 ; sigma^2 = lambda = 16 ; SD = 4\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =16  ENTER.  -> B1 = 16\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =16  ENTER.  -> B2 = 16\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 4.0000\n   So the distribution is  X -> N(mu = 16, sigma^2 = 16).\nSTEP 4: For P(X<=8):  click an empty cell (say D1) and type  =NORM.DIST(8,B1,B3,TRUE)  ENTER.   -> D1 = 0.0228\nSTEP 5: For P(4<X<=8):  click an empty cell (say D2) and type  =NORM.DIST(8,B1,B3,TRUE)-NORM.DIST(4,B1,B3,TRUE)  ENTER.   -> D2 = 0.0214\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 16, sigma^2 = 16)\n   Example             Function used                                           Probability\n   P(X<=8)             =NORM.DIST(8,16,4,TRUE)                                 0.0228\n   P(4<X<=8)           =NORM.DIST(8,16,4,TRUE)-NORM.DIST(4,16,4,TRUE)          0.0214"}, {"title": "SLIP No. 14", "text": "##############################################################################\nSLIP No. 14\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 15 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(|X|>=x)=0.2:  click cell B1 and type:  =T.INV.2T(0.2,15)   then press ENTER.\nSTEP 3:    -> B1 shows 1.3406.\nSTEP 4: For part (ii)  P(X>=x)=0.01:  click cell B2 and type:  =T.INV(1-0.01,15)   then press ENTER.\nSTEP 5:    -> B2 shows 2.6025.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(|X|>=x)=0.2          =T.INV.2T(0.2,15)                  1.3406\n   P(X>=x)=0.01           =T.INV(1-0.01,15)                  2.6025\n\nQ1(b) [3 marks]  X ~ N(0,1). Find (i) P(Z>=0) (ii) P(Z<=-1) (iii) P(Z<=1).\n------------------------------------------------------------------------------\nSTEP 1: This is the STANDARD normal N(0,1), so use NORM.S.DIST(z,TRUE). No mean/sd needed.\nSTEP 2: For P(Z>=0):  click an empty cell (say D1) and type  =1-NORM.S.DIST(0,TRUE)  ENTER.   -> D1 = 0.5000\nSTEP 3: For P(Z<=-1):  click an empty cell (say D2) and type  =NORM.S.DIST(-1,TRUE)  ENTER.   -> D2 = 0.1587\nSTEP 4: For P(Z<=1):  click an empty cell (say D3) and type  =NORM.S.DIST(1,TRUE)  ENTER.   -> D3 = 0.8413\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(Z>=0)             =1-NORM.S.DIST(0,TRUE)                                  0.5000\n   P(Z<=-1)            =NORM.S.DIST(-1,TRUE)                                   0.1587\n   P(Z<=1)             =NORM.S.DIST(1,TRUE)                                    0.8413"}, {"title": "SLIP No. 15", "text": "##############################################################################\nSLIP No. 15\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 20 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(|X|<=x)=0.01:  click cell B1 and type:  =T.INV.2T(1-0.01,20)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0127.\nSTEP 4: For part (ii)  P(X<=x)=0.95:  click cell B2 and type:  =T.INV(0.95,20)   then press ENTER.\nSTEP 5:    -> B2 shows 1.7247.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(|X|<=x)=0.01         =T.INV.2T(1-0.01,20)               0.0127\n   P(X<=x)=0.95           =T.INV(0.95,20)                    1.7247\n\nQ1(b) [3 marks]  X ~ N(12,16). Find (i) P(5<=X<=12) (ii) P(X<=12) (iii) P(X>=20).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 12 ; variance = 16 so SD = square root of variance.\nSTEP 2: Click cell A1 type 'Mean'; click B1 and type  =12  ENTER.\nSTEP 3: Click A2 type 'Variance'; click B2 and type  =16  ENTER.\nSTEP 4: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 4.0000\nSTEP 5: For P(5<=X<=12):  click an empty cell (say D1) and type  =NORM.DIST(12,B1,B3,TRUE)-NORM.DIST(5,B1,B3,TRUE)  ENTER.   -> D1 = 0.4599\nSTEP 6: For P(X<=12):  click an empty cell (say D2) and type  =NORM.DIST(12,B1,B3,TRUE)  ENTER.   -> D2 = 0.5000\nSTEP 7: For P(X>=20):  click an empty cell (say D3) and type  =1-NORM.DIST(20,B1,B3,TRUE)  ENTER.   -> D3 = 0.0228\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(5<=X<=12)         =NORM.DIST(12,12,4,TRUE)-NORM.DIST(5,12,4,TRUE)         0.4599\n   P(X<=12)            =NORM.DIST(12,12,4,TRUE)                                0.5000\n   P(X>=20)            =1-NORM.DIST(20,12,4,TRUE)                              0.0228"}, {"title": "SLIP No. 16", "text": "##############################################################################\nSLIP No. 16\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 12 d.f.. Find x.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=x)=0.1:  click cell B1 and type:  =T.INV(1-0.1,12)   then press ENTER.\nSTEP 3:    -> B1 shows 1.3562.\nSTEP 4: For part (ii)  P(X<=x)=0.99:  click cell B2 and type:  =T.INV(0.99,12)   then press ENTER.\nSTEP 5:    -> B2 shows 2.6810.\nHOW TO DECIDE THE FUNCTION: probability is given and x is wanted -> use an INVERSE function (INV). Right-tail probability alpha -> '.INV.RT' (or INV(1 - alpha)). Left probability -> INV(p).\nWRITE IN EXAM:\n   Condition              Function used                      x\n   P(X>=x)=0.1            =T.INV(1-0.1,12)                   1.3562\n   P(X<=x)=0.99           =T.INV(0.99,12)                    2.6810\n\nQ1(b) [3 marks]  Z ~ N(0,1). Find (i) P(0<=Z<=1) (ii) P(Z<=2) (iii) P(Z>1).\n------------------------------------------------------------------------------\nSTEP 1: This is the STANDARD normal N(0,1), so use NORM.S.DIST(z,TRUE). No mean/sd needed.\nSTEP 2: For P(0<=Z<=1):  click an empty cell (say D1) and type  =NORM.S.DIST(1,TRUE)-NORM.S.DIST(0,TRUE)  ENTER.   -> D1 = 0.3413\nSTEP 3: For P(Z<=2):  click an empty cell (say D2) and type  =NORM.S.DIST(2,TRUE)  ENTER.   -> D2 = 0.9772\nSTEP 4: For P(Z>1):  click an empty cell (say D3) and type  =1-NORM.S.DIST(1,TRUE)  ENTER.   -> D3 = 0.1587\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                           Probability\n   P(0<=Z<=1)          =NORM.S.DIST(1,TRUE)-NORM.S.DIST(0,TRUE)                0.3413\n   P(Z<=2)             =NORM.S.DIST(2,TRUE)                                    0.9772\n   P(Z>1)              =1-NORM.S.DIST(1,TRUE)                                  0.1587"}, {"title": "SLIP No. 17", "text": "##############################################################################\nSLIP No. 17\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 25 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(|X|>=1.602):  click cell B1 and type:  =T.DIST.2T(1.602,25)   then press ENTER.\nSTEP 3:    -> B1 shows 0.1217.\nSTEP 4: For part (ii)  P(|X|<=2.302):  click cell B2 and type:  =1-T.DIST.2T(2.302,25)   then press ENTER.\nSTEP 5:    -> B2 shows 0.9701.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(|X|>=1.602)          =T.DIST.2T(1.602,25)               0.1217\n   P(|X|<=2.302)          =1-T.DIST.2T(2.302,25)             0.9701\n\nQ1(b) [3 marks]  X ~ N(5,4); Z = 2X-3. Find distribution; (i) P(2X-3<10) (ii) P(2X-3>4).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): Mean = 2(5)-3 = 7 ; Variance = 2^2(4) = 16 ; SD = 4\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =2*5-3  ENTER.  -> B1 = 7\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =4*4  ENTER.  -> B2 = 16\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 4.0000\n   So the distribution is  Z ~ N(mu = 7, sigma^2 = 16).\nSTEP 4: For P(2X-3<10):  click an empty cell (say D1) and type  =NORM.DIST(10,B1,B3,TRUE)  ENTER.   -> D1 = 0.7734\nSTEP 5: For P(2X-3>4):  click an empty cell (say D2) and type  =1-NORM.DIST(4,B1,B3,TRUE)  ENTER.   -> D2 = 0.7734\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 7, sigma^2 = 16)\n   Example             Function used                                           Probability\n   P(2X-3<10)          =NORM.DIST(10,7,4,TRUE)                                 0.7734\n   P(2X-3>4)           =1-NORM.DIST(4,7,4,TRUE)                                0.7734"}, {"title": "SLIP No. 18", "text": "##############################################################################\nSLIP No. 18\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 8 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=3.204):  click cell B1 and type:  =T.DIST.RT(3.204,8)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0063.\nSTEP 4: For part (ii)  P(|X|<=1.908):  click cell B2 and type:  =1-T.DIST.2T(1.908,8)   then press ENTER.\nSTEP 5:    -> B2 shows 0.9072.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=3.204)            =T.DIST.RT(3.204,8)                0.0063\n   P(|X|<=1.908)          =1-T.DIST.2T(1.908,8)              0.9072\n\nQ1(b) [3 marks]  X~N(15,4) indep. Y~N(5,9); Z=X-2Y+3. Find distribution; (i) P(Z<=10) (ii) P(Z>12).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): Mean = 15-2(5)+3 = 8 ; Variance = 1^2(4)+(-2)^2(9) = 4+36 = 40 (variance ADDS even for subtraction) ; SD = 6.3246\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =15-2*5+3  ENTER.  -> B1 = 8\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =1*4+4*9  ENTER.  -> B2 = 40\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 6.3246\n   So the distribution is  Z ~ N(mu = 8, sigma^2 = 40).\nSTEP 4: For P(Z<=10):  click an empty cell (say D1) and type  =NORM.DIST(10,B1,B3,TRUE)  ENTER.   -> D1 = 0.6241\nSTEP 5: For P(Z>12):  click an empty cell (say D2) and type  =1-NORM.DIST(12,B1,B3,TRUE)  ENTER.   -> D2 = 0.2635\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 8, sigma^2 = 40)\n   Example             Function used                                           Probability\n   P(Z<=10)            =NORM.DIST(10,8,SQRT(40),TRUE)                          0.6241\n   P(Z>12)             =1-NORM.DIST(12,8,SQRT(40),TRUE)                        0.2635"}, {"title": "SLIP No. 19", "text": "##############################################################################\nSLIP No. 19\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 26 d.f.. Find the following probabilities (alpha).\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type the label:  Answer\nSTEP 2: For part (i)  P(X>=0.764):  click cell B1 and type:  =T.DIST.RT(0.764,26)   then press ENTER.\nSTEP 3:    -> B1 shows 0.2259.\nSTEP 4: For part (ii)  P(X<=0.5):  click cell B2 and type:  =T.DIST(0.5,26,TRUE)   then press ENTER.\nSTEP 5:    -> B2 shows 0.6894.\nHOW TO DECIDE THE FUNCTION: 'P(X >= x)' is the RIGHT tail -> '.RT' function. 'P(X <= x)' is the left/cumulative -> DIST(...,TRUE). 'P(|X| >= x)' is two-tailed -> '.2T'.\nWRITE IN EXAM:\n   x                      Function used                      alpha\n   P(X>=0.764)            =T.DIST.RT(0.764,26)               0.2259\n   P(X<=0.5)              =T.DIST(0.5,26,TRUE)               0.6894\n\nQ1(b) [3 marks]  X ~ B(n=400, p=0.5): normal approximation, then (i) P(X<215) (ii) P(X<=185).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = np = 400 x 0.5 = 200 ; sigma^2 = npq = 400 x 0.5 x 0.5 = 100 ; SD = 10\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =400*0.5  ENTER.  -> B1 = 200\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =400*0.5*0.5  ENTER.  -> B2 = 100\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 10.0000\n   So the distribution is  X -> N(mu = 200, sigma^2 = 100).\nSTEP 4: For P(X<215):  click an empty cell (say D1) and type  =NORM.DIST(215,B1,B3,TRUE)  ENTER.   -> D1 = 0.9332\nSTEP 5: For P(X<=185):  click an empty cell (say D2) and type  =NORM.DIST(185,B1,B3,TRUE)  ENTER.   -> D2 = 0.0668\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 200, sigma^2 = 100)\n   Example             Function used                                           Probability\n   P(X<215)            =NORM.DIST(215,200,10,TRUE)                             0.9332\n   P(X<=185)           =NORM.DIST(185,200,10,TRUE)                             0.0668"}, {"title": "SLIP No. 20", "text": "##############################################################################\nSLIP No. 20\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 12 d.f. Find the 55th percentile, present it on a graph, and write the function used.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type:  Percentile  (just a label).\nSTEP 2: Click cell B1 and type:  =T.INV(0.55,12)   then press ENTER.\nSTEP 3:    -> B1 shows 0.1283.  This is the 55th percentile (P(X <= x) = 0.55).\nSTEP 4: GRAPH DATA - click cell D1 and type:  x   ;  click E1 and type:  f(x)\nSTEP 5: Click D2 and type -4 ; click D3 and type -3.5.\nSTEP 6: Select D2:D3, then drag the small square at the bottom-right corner of the selection downward until the last value is 4 (cell D18).\nSTEP 7: Click E2 and type:  =T.DIST(D2,12,FALSE)  and press ENTER. (FALSE gives the curve height.)\nSTEP 8: Click E2 again, then drag the small square at its bottom-right corner down to E18 so all rows are filled.\nSTEP 9: Mark the percentile point: click G1 and type =B1 ; click H1 and type =T.DIST(G1,12,FALSE) (height of curve at the percentile).\nSTEP 10: Select D1:E18 > Insert > Charts > Scatter > 'Scatter with Smooth Lines'.\nSTEP 11: Right-click the chart > Select Data > Add > Series name: Percentile ; X values: G1 ; Y values: H1 > OK. Change this new series to markers only (Format Data Series > Marker).\nSTEP 12: Click the chart title and type:  t-distribution (df = 12) with 55th percentile.  Add axis titles x and f(x).\nWRITE IN EXAM:\n   Function used : =T.INV(0.55,12)\n   55th percentile = 0.1283\n   Graph: bell-shaped curve with the point x = 0.1283 marked on it (attach the chart).\n\nQ1(b) [3 marks]  X ~ P(lambda=25): normal approximation, then (i) P(X<=30) (ii) P(20<X<=30).\n------------------------------------------------------------------------------\nCALCULATION FIRST (write on paper): mu = lambda = 25 ; sigma^2 = lambda = 25 ; SD = 5\nSTEP 1: Open a blank sheet. Click A1 type 'Mean'; click B1 and type  =25  ENTER.  -> B1 = 25\nSTEP 2: Click A2 type 'Variance'; click B2 and type  =25  ENTER.  -> B2 = 25\nSTEP 3: Click A3 type 'SD'; click B3 and type  =SQRT(B2)  ENTER.  -> B3 = 5.0000\n   So the distribution is  X -> N(mu = 25, sigma^2 = 25).\nSTEP 4: For P(X<=30):  click an empty cell (say D1) and type  =NORM.DIST(30,B1,B3,TRUE)  ENTER.   -> D1 = 0.8413\nSTEP 5: For P(20<X<=30):  click an empty cell (say D2) and type  =NORM.DIST(30,B1,B3,TRUE)-NORM.DIST(20,B1,B3,TRUE)  ENTER.   -> D2 = 0.6827\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Distribution: N(mu = 25, sigma^2 = 25)\n   Example             Function used                                           Probability\n   P(X<=30)            =NORM.DIST(30,25,5,TRUE)                                0.8413\n   P(20<X<=30)         =NORM.DIST(30,25,5,TRUE)-NORM.DIST(20,25,5,TRUE)        0.6827"}, {"title": "SLIP No. 21", "text": "##############################################################################\nSLIP No. 21\n##############################################################################\nQ1(a) [2 marks]  X ~ t-distribution with 15 d.f. Find the 50th percentile, present it on a graph, and write the function used.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank Excel sheet. Click cell A1 and type:  Percentile  (just a label).\nSTEP 2: Click cell B1 and type:  =T.INV(0.5,15)   then press ENTER.\nSTEP 3:    -> B1 shows 0.0000.  This is the 50th percentile (P(X <= x) = 0.5).\nSTEP 4: GRAPH DATA - click cell D1 and type:  x   ;  click E1 and type:  f(x)\nSTEP 5: Click D2 and type -4 ; click D3 and type -3.5.\nSTEP 6: Select D2:D3, then drag the small square at the bottom-right corner of the selection downward until the last value is 4 (cell D18).\nSTEP 7: Click E2 and type:  =T.DIST(D2,15,FALSE)  and press ENTER. (FALSE gives the curve height.)\nSTEP 8: Click E2 again, then drag the small square at its bottom-right corner down to E18 so all rows are filled.\nSTEP 9: Mark the percentile point: click G1 and type =B1 ; click H1 and type =T.DIST(G1,15,FALSE) (height of curve at the percentile).\nSTEP 10: Select D1:E18 > Insert > Charts > Scatter > 'Scatter with Smooth Lines'.\nSTEP 11: Right-click the chart > Select Data > Add > Series name: Percentile ; X values: G1 ; Y values: H1 > OK. Change this new series to markers only (Format Data Series > Marker).\nSTEP 12: Click the chart title and type:  t-distribution (df = 15) with 50th percentile.  Add axis titles x and f(x).\nWRITE IN EXAM:\n   Function used : =T.INV(0.5,15)\n   50th percentile = 0.0000\n   Graph: bell-shaped curve with the point x = 0.0000 marked on it (attach the chart).\n\nQ1(b) [3 marks]  X ~ N(65,100). In a class of 100 students find the number scoring (i) more than 95 (ii) less than 35.\n------------------------------------------------------------------------------\nSTEP 1: Open a blank sheet. Mean = 65 ; variance = 100 so SD = 10.\nSTEP 2: Click B1 and type  =65  (mean) ; click B3 and type  =10  (SD).\nSTEP 3: For P(X>95):  click an empty cell (say D1) and type  =1-NORM.DIST(95,B1,B3,TRUE)  ENTER.   -> D1 = 0.0013\nSTEP 4: For P(X<=35):  click an empty cell (say D2) and type  =NORM.DIST(35,B1,B3,TRUE)  ENTER.   -> D2 = 0.0013\nSTEP 5: Number of plots/students for P(X>95): click F1 and type  =100*D1  ENTER.  -> 100 x 0.0013 = 0.13  (round to 0).\nSTEP 6: Number of plots/students for P(X<=35): click F2 and type  =100*D2  ENTER.  -> 100 x 0.0013 = 0.13  (round to 0).\n   (Tip: with TRUE the function gives the LEFT area P(X<=a). For '>' we subtract from 1. For 'between' we subtract two left areas.)\nWRITE IN EXAM:\n   Example             Function used                                 Probability No. of\n   P(X>95)             =1-NORM.DIST(95,65,10,TRUE)                   0.0013      0\n   P(X<=35)            =NORM.DIST(35,65,10,TRUE)                     0.0013      0"}];
const root=document.getElementById('items'), search=document.getElementById('search'), count=document.getElementById('count');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){let q=search.value.toLowerCase(),n=0;root.innerHTML='';
slips.forEach(s=>{if(q&&!s.text.toLowerCase().includes(q))return;n++;
let d=document.createElement('details');d.className='slip';d.open=!!q;
let sum=document.createElement('summary');sum.textContent=s.title;d.appendChild(sum);
let pre=document.createElement('div');pre.className='original';pre.innerHTML=esc(s.text).replace(/(STEP\\s+\\d+:|CALCULATION FIRST|WRITE IN EXAM:|HOW TO DECIDE THE FUNCTION:)/g,'<span class="step">$1</span>');d.appendChild(pre);root.appendChild(d);
});
count.textContent=`Showing ${n} of ${slips.length} slip sections. The text inside each section is copied from your original file.`;
if(!n)root.innerHTML='<p style="padding:20px;background:white">No matches found.</p>';
}
search.addEventListener('input',render);document.getElementById('expand').onclick=()=>document.querySelectorAll('.slip').forEach(x=>x.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('.slip').forEach(x=>x.open=false);document.getElementById('print').onclick=()=>window.print();render();
</script></body></html>
